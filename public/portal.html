<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أرشيف نشراتك — InboxLoops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'; this.onload=null;">
<noscript><link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
  :root{ --ink:#14213D; --paper:#F5F6F2; --paper-raised:#FFFFFF; --accent:#3F6659; --accent-soft:#E4EBE7; --text:#1E2430; --text-muted:#5B6470; --border:#DEE1DA; }
  *{box-sizing:border-box;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--paper); color:var(--text); margin:0; padding:24px; }
  .wrap{ max-width:560px; margin:0 auto; }
  h1{ font-family:'Lora', serif; color:var(--ink); font-size:20px; text-align:center; margin-bottom:20px; }
  .item{ background:var(--paper-raised); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; text-decoration:none; color:inherit; display:block; }
  .item .status{ display:inline-block; font-size:11px; padding:2px 9px; border-radius:10px; background:var(--accent-soft); color:var(--accent); margin-bottom:6px; }
  .item .snippet{ font-size:13.5px; color:var(--text-muted); }
  .item .date{ font-size:11px; color:var(--text-muted); margin-top:6px; }
  .muted{ text-align:center; color:var(--text-muted); font-size:14px; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>أرشيف نشراتك</h1>
  <div id="list"><p class="muted">جارٍ التحميل…</p></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const email = params.get('email');
const token = params.get('token');

const statusLabels = {
  pending_agency_review: 'قيد المراجعة الداخلية',
  pending_client_review: 'بانتظار موافقتك',
  needs_agency_recheck: 'قيد التعديل',
  ready_to_schedule: 'بانتظار الجدولة',
  sent: 'تم الإرسال ✅'
};

function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[char]));
}

async function load(){
  const listEl = document.getElementById('list');
  if(!email || !token){
    listEl.innerHTML = '<p class="muted">رابط غير صالح</p>';
    return;
  }
  const res = await fetch(`/api/client-portal?email=${encodeURIComponent(email)}&token=${token}`);
  if(!res.ok){
    listEl.innerHTML = '<p class="muted">رابط غير صالح أو منتهي</p>';
    return;
  }
  const drafts = await res.json();
  if(drafts.length === 0){
    listEl.innerHTML = '<p class="muted">لا توجد نشرات بعد</p>';
    return;
  }
  listEl.innerHTML = drafts.map(d => `
    <a class="item" href="review.html?id=${d.id}&token=${d.magicToken || ''}">
      <div class="status">${escapeHtml(statusLabels[d.status] || d.status)}</div>
      <div class="snippet">${escapeHtml(d.snippet)}…</div>
      <div class="date">${new Date(d.createdAt).toLocaleDateString('ar')}</div>
    </a>
  `).join('');
}
load();
</script>
</body>
</html>
