<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الصفحة غير موجودة — InboxLoops</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=IBM+Plex+Sans+Arabic:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#14213D; --paper:#F5F6F2; --accent:#3F6659; --text-muted:#5B6470; }
  *{box-sizing:border-box;}
  body{ font-family:'IBM Plex Sans Arabic', sans-serif; background:var(--paper); color:var(--ink); margin:0; height:100vh; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; }
  h1{ font-family:'Lora', serif; font-size:24px; margin-bottom:10px; }
  p{ color:var(--text-muted); font-size:14.5px; margin-bottom:22px; }
  a{ background:var(--accent); color:#fff; text-decoration:none; padding:11px 24px; border-radius:10px; font-size:14px; }
</style>
</head>
<body>
<div>
  <h1>هذه الصفحة غير موجودة</h1>
  <p>الرابط قد يكون غير صحيح أو انتهت صلاحيته.</p>
  <a href="/">العودة للصفحة الرئيسية</a>
</div>
</body>
</html>
